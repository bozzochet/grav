xss_whitelist:
  - admin.super
xss_enabled:
  on_events: true
  invalid_protocols: true
  moz_binding: true
  html_inline_styles: true
  dangerous_tags: true
xss_invalid_protocols:
  - javascript
  - livescript
  - vbscript
  - mocha
  - feed
  - data
xss_dangerous_tags:
  - applet
  - meta
  - xml
  - blink
  - link
  - style
  - script
  - embed
  - object
  - ilayer
  - layer
  - bgsound
  - title
  - base
  - isindex
  - svg
  - math
  - option
  - select
uploads_dangerous_extensions:
  - php
  - php2
  - php3
  - php4
  - php5
  - phar
  - phtml
  - html
  - htm
  - shtml
  - shtm
  - js
  - exe
  - md
  - yaml
  - yml
  - json
  - twig
  - ini
sanitize_svg: true
twig_content:
  process_enabled: true
  editor_enabled: true
  config_access: true
twig_sandbox:
  enabled: true
  logging: true
  admin_hint: true
  config_denied_paths:
    - plugins
    - streams
    - security
    - backups
    - scheduler
  allowed_tags:
    - apply
    - autoescape
    - block
    - deprecated
    - do
    - embed
    - extends
    - for
    - from
    - if
    - import
    - include
    - macro
    - sandbox
    - set
    - spaceless
    - types
    - use
    - verbatim
    - with
  allowed_filters:
    - abs
    - batch
    - capitalize
    - column
    - convert_encoding
    - country_name
    - currency_name
    - currency_symbol
    - data_uri
    - date
    - date_modify
    - default
    - e
    - escape
    - filter
    - first
    - format
    - format_currency
    - format_date
    - format_datetime
    - format_number
    - format_time
    - html_to_markdown
    - inline_css
    - inky_to_html
    - join
    - json_encode
    - keys
    - language_name
    - last
    - length
    - locale_name
    - lower
    - map
    - markdown_to_html
    - merge
    - nl2br
    - number_format
    - reduce
    - replace
    - reverse
    - round
    - slice
    - slug
    - sort
    - split
    - striptags
    - timezone_name
    - title
    - trim
    - u
    - upper
    - url_encode
    - absolute_url
    - array
    - array_diff
    - array_unique
    - base32_decode
    - base32_encode
    - base64_decode
    - base64_encode
    - basename
    - bool
    - chunk_split
    - contains
    - count
    - defined
    - dirname
    - ends_with
    - fieldName
    - float
    - get_type
    - int
    - json_decode
    - ksort
    - ltrim
    - markdown
    - md5
    - modulus
    - nicecron
    - nicefilesize
    - nicenumber
    - nicetime
    - of_type
    - pad
    - parent_field
    - print_r
    - randomize
    - regex_replace
    - replace_last
    - rtrim
    - safe_email
    - safe_truncate
    - safe_truncate_html
    - sort_by_key
    - starts_with
    - string
    - t
    - ta
    - tl
    - truncate
    - truncate_html
    - wordcount
    - yaml
    - yaml_decode
    - yaml_encode
  allowed_functions:
    - attribute
    - block
    - cycle
    - date
    - max
    - min
    - parent
    - random
    - range
    - array
    - array_diff
    - array_intersect
    - array_key_exists
    - array_key_value
    - array_unique
    - authorize
    - body_class
    - count
    - cron
    - debug
    - dump
    - get_cookie
    - get_type
    - gist
    - header_var
    - is_array
    - is_countable
    - is_iterable
    - is_null
    - is_numeric
    - is_object
    - is_string
    - isajaxrequest
    - json_decode
    - md5
    - media_directory
    - nicefilesize
    - nicenumber
    - nicetime
    - of_type
    - random_string
    - regex_filter
    - regex_match
    - regex_replace
    - regex_split
    - repeat
    - string
    - t
    - ta
    - theme_var
    - tl
    - unique_id
    - url
    - vardump
    - xss
  allowed_methods:
    -
      class: Grav\Common\Grav
      methods: 'offsetexists, getversion, theme'
    -
      class: Grav\Common\Config\Config
      methods: 'get, value, default, offsetget, offsetexists'
    -
      class: Grav\Common\Twig\Sandbox\SandboxConfig
      methods: 'get, toarray, value, offsetget, offsetexists'
    -
      class: Grav\Common\Page\Interfaces\PageInterface
      methods: 'content, header, title, menu, slug, route, rawroute, url, path, permalink, template, templateformat, filepath, date, dateformat, modified, media, parent, children, collection, find, findmedia, value, summary, taxonomy, visible, published, publishdate, unpublishdate, routable, language, modular, modulartwig, ismodule, ispage, isfirst, islast, adjacentsibling, prevsibling, nextsibling, metadata, id, order, breadcrumbs, home, tostring, __tostring'
    -
      class: Grav\Common\Page\Pages
      methods: 'root, base, dispatch, home, all, children, instances, routes, sort'
    -
      class: Grav\Common\Uri
      methods: 'path, url, params, param, query, host, port, scheme, route, base, extension, method, referrer, ip, addr, toarray, __tostring'
    -
      class: Grav\Common\Page\Media
      methods: 'images, videos, audios, files, all, get, offsetget, offsetexists, __tostring'
    -
      class: Grav\Common\Media\Interfaces\MediaCollectionInterface
      methods: 'images, videos, audios, files, all, get, offsetget, offsetexists, __tostring'
    -
      class: Grav\Common\Page\Medium\Medium
      methods: 'url, html, filepath, filename, metadata, srcset, parsedownelement, __tostring, @media_actions'
    -
      class: Grav\Common\Media\Interfaces\MediaLinkInterface
      methods: 'html, url, __tostring, parsedownelement, srcset, @media_actions'
    -
      class: Grav\Common\User\Interfaces\UserInterface
      methods: 'authorize, authorized, authenticated, username, fullname, email, language, offsetget, offsetexists'
    -
      class: Grav\Common\Taxonomy
      methods: taxonomy
    -
      class: Grav\Common\Language\Language
      methods: 'getactive, getdefault, getlanguages, getlanguage, enabled'
    -
      class: Grav\Common\Assets
      methods: '__tostring, addcss, addjs'
    -
      class: stdClass
      methods: '*'
    -
      class: Grav\Common\Data\Data
      methods: 'get, value, items, offsetget, offsetexists, __tostring'
  allowed_properties:
    -
      class: Grav\Common\Page\Interfaces\PageInterface
      methods: 'header, media, taxonomy'
    -
      class: Grav\Common\Grav
      methods: theme
    -
      class: Grav\Common\Media\Interfaces\MediaCollectionInterface
      methods: '*'
    -
      class: Grav\Common\Page\Media
      methods: '*'
    -
      class: Grav\Common\Page\Medium\Medium
      methods: '*'
    -
      class: stdClass
      methods: '*'
read_file:
  allowed_streams:
    - theme
    - themes
    - page
    - user-data
  allowed_extensions:
    - md
    - markdown
    - txt
    - html
    - htm
    - css
    - json
    - csv
    - xml
    - svg
  max_size: 1048576
